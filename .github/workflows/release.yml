name: Release

on:
  push:
    tags:
      - 'v*'

# contents: write  -> create the GitHub Release and upload assets.
# id-token: write  -> mint the OIDC token for npm Trusted Publishing (provenance).
permissions:
  contents: write
  id-token: write

# Pin Yarn's cache to a deterministic project-local path on every OS.
env:
  YARN_ENABLE_GLOBAL_CACHE: 'false'

jobs:
  # Build N-API-tagged prebuilt binaries on each target platform. Because the
  # addon is N-API-tagged (--napi), ONE prebuild per platform serves all Node
  # LTS versions, so we only need a single Node here (22).
  prebuild:
    name: prebuild (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS arch split: macos-15-intel runners are Intel (darwin-x64),
        # while macos-latest is Apple Silicon (darwin-arm64). Both are needed
        # to ship prebuilds for each macOS architecture. (Legacy Intel runner
        # labels like macos-13 are being retired; use *-intel going forward.)
        # The Linux musl/Alpine prebuild lives in its own `prebuild-musl` job
        # below -- it needs a container and a different step list.
        os: [ubuntu-latest, macos-15-intel, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up CMake
        uses: lukka/get-cmake@latest

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Corepack's default shim location doesn't reliably override the runner's
      # preinstalled classic Yarn 1.x (notably on Windows / Node 26). Install the
      # yarn@4 shim to a dir we control and prepend it to PATH.
      - name: Enable Corepack (pinned Yarn)
        shell: bash
        run: |
          # --install-directory requires the target dir to exist; create it with
          # Node so the path is handled natively on Windows.
          node -e "require('fs').mkdirSync(process.env.RUNNER_TEMP + '/corepack', { recursive: true })"
          corepack enable --install-directory "$RUNNER_TEMP/corepack"
          echo "$RUNNER_TEMP/corepack" >> "$GITHUB_PATH"

      - name: Cache Yarn
        uses: actions/cache@v6
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --immutable --mode=skip-build

      # scripts/prebuild.mjs builds a Release binary with cmake-js and copies it
      # to prebuilds/<platform>-<arch>/node.napi[.<libc>].node. The N-API tag
      # means one prebuild per platform serves every supported Node LTS.
      - name: Prebuild native binary
        run: yarn prebuild

      - name: Upload prebuilds
        uses: actions/upload-artifact@v7
        with:
          name: prebuilds-${{ matrix.os }}
          path: prebuilds/
          if-no-files-found: error
          retention-days: 7

  # Linux / musl (Alpine) prebuild. A separate job rather than a matrix entry: it
  # needs a container and a different step list (no setup-node, no get-cmake, plus
  # an apk step). See ci.yml's build-test-musl for the full rationale. linux-x64
  # only -- the runner ships musl Node externals for JavaScript actions on x64
  # Linux runners only.
  #
  # No job-level env: needed; YARN_ENABLE_GLOBAL_CACHE is set workflow-wide above.
  prebuild-musl:
    name: prebuild (alpine musl)
    runs-on: ubuntu-latest
    container: node:22-alpine
    # Alpine has no bash; keep every run body POSIX sh.
    defaults:
      run:
        shell: sh

    steps:
      # Must precede checkout and cache. Per-package rationale in ci.yml:
      #   build-base -> g++ / gcc / make / binutils / musl-dev
      #   cmake      -> get-cmake ships glibc-only Kitware binaries
      #   git        -> QuickFIX FetchContent clone + a real actions/checkout clone
      #   tar zstd   -> actions/cache needs GNU tar (not busybox) and prefers zstd
      - name: Install toolchain (apk)
        run: apk add --no-cache build-base cmake git tar zstd

      - name: Checkout
        uses: actions/checkout@v7

      # Deliberately no actions/setup-node (would install a glibc Node) and no
      # lukka/get-cmake (glibc-only).

      # node:*-alpine preinstalls classic Yarn 1.x at /usr/local/bin/yarn, which is
      # also Corepack's default install directory, so the shim override still
      # applies. RUNNER_TEMP is /__w/_temp inside a container job.
      - name: Enable Corepack (pinned Yarn)
        run: |
          node -e "require('fs').mkdirSync(process.env.RUNNER_TEMP + '/corepack', { recursive: true })"
          corepack enable --install-directory "$RUNNER_TEMP/corepack"
          echo "$RUNNER_TEMP/corepack" >> "$GITHUB_PATH"

      # Front-loaded libc tag: runner.os is "Linux" here and in the glibc prebuild
      # job, whose `restore-keys: yarn-Linux-` would otherwise prefix-match this.
      - name: Cache Yarn
        uses: actions/cache@v6
        with:
          path: .yarn/cache
          key: yarn-musl-Linux-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-musl-Linux-

      - name: Install dependencies
        run: yarn install --immutable --mode=skip-build

      # Emits prebuilds/linux-x64/node.napi.musl.node: scripts/prebuild.mjs tags
      # musl by the ABSENCE of header.glibcVersionRuntime in the process report
      # (Node emits that field only under #ifdef __GLIBC__), and cross-checks it
      # against /etc/alpine-release before writing.
      - name: Prebuild native binary
        run: yarn prebuild

      # Distinct name: upload-artifact errors on duplicates and the glibc job
      # already claims "prebuilds-ubuntu-latest". Still matches the publish job's
      # `pattern: prebuilds-*`; merge-multiple is safe because the two Linux
      # artifacts share the linux-x64/ directory but differ in FILENAME
      # (node.napi.glibc.node vs node.napi.musl.node).
      - name: Upload prebuilds
        uses: actions/upload-artifact@v7
        with:
          name: prebuilds-linux-musl
          path: prebuilds/
          if-no-files-found: error
          retention-days: 7

  # Assemble every platform's prebuilds, build the TS, publish to npm with
  # provenance (OIDC), and cut a GitHub Release with the tarball + prebuilds.
  publish:
    name: publish
    needs: [prebuild, prebuild-musl]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      # Corepack's default shim location doesn't reliably override the runner's
      # preinstalled classic Yarn 1.x (notably on Windows / Node 26). Install the
      # yarn@4 shim to a dir we control and prepend it to PATH.
      - name: Enable Corepack (pinned Yarn)
        shell: bash
        run: |
          # --install-directory requires the target dir to exist; create it with
          # Node so the path is handled natively on Windows.
          node -e "require('fs').mkdirSync(process.env.RUNNER_TEMP + '/corepack', { recursive: true })"
          corepack enable --install-directory "$RUNNER_TEMP/corepack"
          echo "$RUNNER_TEMP/corepack" >> "$GITHUB_PATH"

      - name: Cache Yarn
        uses: actions/cache@v6
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --immutable --mode=skip-build

      # Merge ALL per-platform prebuild artifacts back into ./prebuilds so the
      # published tarball carries binaries for every supported platform/arch.
      - name: Download all prebuilds
        uses: actions/download-artifact@v8
        with:
          pattern: prebuilds-*
          merge-multiple: true
          path: prebuilds

      # Compile TypeScript only (dual ESM/CJS) for the tarball. The native
      # binaries come from the merged prebuilds above, so no native build here.
      - name: Build TypeScript
        run: yarn build:ts

      # package.json is the single source of truth for the version; the tag must
      # be v<that version>. Fail fast if they disagree so a mistyped/stale tag
      # never publishes a wrong version. See VERSIONING.md.
      - name: Verify version matches tag
        shell: bash
        run: |
          pkg=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "::error::package.json ($pkg) != tag ($tag)"; exit 1
          fi

      # npm Trusted Publishing (OIDC provenance) requires npm >= 11.5.1. The npm
      # bundled with Node 22 may be older, so upgrade the global npm.
      - name: Upgrade npm (for OIDC provenance)
        run: npm install -g npm@latest

      # OIDC Trusted Publishing: NO NPM_TOKEN needed. This requires a configured
      # Trusted Publisher on npmjs.com for @homaiohq/napi-quickfix pointing at
      # this repository + this workflow file (.github/workflows/release.yml).
      # See: https://docs.npmjs.com/trusted-publishers
      #
      # SemVer prereleases (tags with a hyphen, e.g. v0.2.0-rc.1) go to the `next`
      # dist-tag; stable releases go to `latest`. See VERSIONING.md.
      - name: Publish to npm (with provenance)
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          dist=latest
          case "$tag" in *-*) dist=next ;; esac
          npm publish --provenance --access public --tag "$dist"

      # Produce the tarball to attach to the GitHub Release.
      - name: Pack tarball
        run: npm pack

      # Zip each platform's prebuilds into a single archive for the Release.
      - name: Archive prebuilds
        run: |
          cd prebuilds
          zip -r ../prebuilds.zip .
          cd ..

      # Create the GitHub Release for the pushed tag with auto-generated notes,
      # attaching the npm tarball and the zipped prebuilt binaries.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          # Flag prerelease tags (those containing a hyphen, e.g. v0.2.0-rc.1).
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            *.tgz
            prebuilds.zip
